name: Fast CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Python 3.11 — unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install lightweight CI dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Compile Python sources
        run: python -m compileall -q app main.py tests

      - name: Run fast unit tests
        run: python -m unittest discover -s tests -v
